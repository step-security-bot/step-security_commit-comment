name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run format-check
      - run: npm run lint
      - run: npm run test

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test create commit comment
        uses: ./
        id: cc
        with:
          body: |
            This is a multi-line test comment
            - With GitHub **Markdown** :sparkles:
            - Created by [commit-comment][1]

            [1]: https://github.com/step-security/commit-comment
          reactions: '+1'

      - name: Test update commit comment
        uses: ./
        with:
          comment-id: ${{ steps.cc.outputs.comment-id }}
          body: |
            **Edit:** Some additional info
          reactions: eyes
          reactions-edit-mode: replace

      - name: Test add reactions
        uses: ./
        with:
          comment-id: ${{ steps.cc.outputs.comment-id }}
          reactions: |
            heart
            hooray
            laugh

      - name: Test create commit comment from file
        uses: ./
        id: cc2
        with:
          body-path: .github/comment-body.md
          reactions: |
            +1

      - name: Test update commit comment from file
        uses: ./
        with:
          comment-id: ${{ steps.cc2.outputs.comment-id }}
          body-path: .github/comment-body-addition.md
          append-separator: space
          reactions: eyes, rocket
          reactions-edit-mode: replace
